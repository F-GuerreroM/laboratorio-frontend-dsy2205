<div class="dashboard-container">
  
  <header class="top-bar">
    <div class="logo">
      <h2>Mi Laboratorio</h2>
    </div>
    <div class="user-actions">
      <span class="perfil-nombre">Hola, {{ nombreUsuario }}</span>
      <button class="btn-perfil" (click)="editarPerfil()">⚙️ Editar Perfil</button>
      <button class="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </header>

  <main class="main-content">
    <div class="header-seccion">
      <h2>Laboratorios Disponibles</h2>
      <p>Selecciona un laboratorio para agendar tu hora médica.</p>

      <button *ngIf="isAdmin" class="btn btn-primary btn-admin" (click)="crearNuevoLaboratorio()">
        + Añadir Laboratorio
      </button>
    </div>

    <app-lab-list 
      [laboratorios]="listaLaboratorios" 
      [isAdmin]="isAdmin" 
      (agregarCita)="abrirModalCita($event)">
    </app-lab-list>

  </main>
</div>
