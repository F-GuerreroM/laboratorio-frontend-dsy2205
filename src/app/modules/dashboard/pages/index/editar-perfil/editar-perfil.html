<div class="dashboard-container">
  
  <header class="top-bar">
    <div class="logo">
      <h2>Mi Laboratorio</h2>
    </div>
    <div class="user-actions">
      <button class="btn-perfil" routerLink="/dashboard">← Volver al Dashboard</button>
    </div>
  </header>

  <main class="main-content" style="display: flex; justify-content: center; margin-top: 40px;">
    <div class="perfil-card">
      <h2 style="text-align: center; color: #0056b3; margin-bottom: 20px;">Editar Mi Perfil</h2>

      <form #perfilForm="ngForm" (ngSubmit)="onActualizar()">
        
        <div class="form-group">
          <label for="username">Nombre de Usuario</label>
          <input 
            type="text" id="username" name="username" 
            [(ngModel)]="perfil.username" 
            required minlength="4" #username="ngModel">
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" id="email" name="email" 
            [(ngModel)]="perfil.email" 
            required email #email="ngModel">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" id="password" name="password" 
            [(ngModel)]="perfil.password" 
            required minlength="8" #password="ngModel">
        </div>

        <button type="submit" class="btn-primary" [disabled]="perfilForm.invalid" style="margin-top: 15px;">
          Guardar Cambios
        </button>
      </form>
    </div>
  </main>
</div>
