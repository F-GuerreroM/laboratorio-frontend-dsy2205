<div class="login-container">
  <div class="login-card">
    <h2 style="text-align: center; color: #0056b3;">Laboratorio Clínico</h2>
    <p style="text-align: center; color: #666; margin-bottom: 20px;">Ingresa tus credenciales para continuar</p>

    <form #loginForm="ngForm" (ngSubmit)="onLogin()">
      
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="credenciales.email" 
          required 
          email
          #email="ngModel">
        <span class="error-msg" *ngIf="email.invalid && email.touched">
          Por favor, ingresa un correo válido.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="credenciales.password" 
          required 
          minlength="8"  #password="ngModel">          
        <span class="error-msg" *ngIf="password.invalid && password.touched">
          La contraseña debe tener al menos 8 caracteres.
        </span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Iniciar Sesión</button>
    </form>

    <div class="login-links">
      <!-- <a routerLink="/auth/registro">Crear cuenta nueva</a> -->
      <a routerLink="/auth/recuperar">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</div>
