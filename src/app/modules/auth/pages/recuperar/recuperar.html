<div class="login-container">
  <div class="login-card">
    <h2 style="text-align: center; color: #0056b3;">Recuperar Contraseña</h2>
    <p style="text-align: center; color: #666; margin-bottom: 20px;">
      Ingresa tu correo registrado y te ayudaremos a restablecer el acceso.
    </p>

    <form #recuperarForm="ngForm" (ngSubmit)="onRecuperar()">
      
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          email
          #emailCtrl="ngModel">
        
        @if (emailCtrl.invalid && emailCtrl.touched) {
          <span class="error-msg">Por favor, ingresa un correo válido.</span>
        }
      </div>

      <button type="submit" class="btn-primary" [disabled]="recuperarForm.invalid">
        Solicitar Nueva Contraseña
      </button>
    </form>

    <div class="login-links" style="margin-top: 20px; text-align: center;">
      <a routerLink="/login">← Volver al Inicio de Sesión</a>
    </div>
  </div>
</div>
